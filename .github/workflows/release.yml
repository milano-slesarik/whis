name: Release to PyPI

on:
  workflow_dispatch:  # manual trigger only
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # only main branch

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Validate version
        run: |
          # extract from pyproject.toml
          PYPROJECT_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          ")

          # PYPROJECT_VERSION=1.0.0
          # inputs.tag=v1.0.0 (prefixed with 'v')

          echo "Version in pyproject.toml: $PYPROJECT_VERSION"
          echo "Requested tag: ${{ inputs.tag }}"

          if [ "${{ inputs.tag }}" != "v$PYPROJECT_VERSION" ]; then
            echo "x ERROR: Version tag mismatch!"
            echo "   Expected: v$PYPROJECT_VERSION"
            echo "   Got: ${{ inputs.tag }}"
            exit 1
          fi

          echo "OK. Version validation passed!"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          files: dist/*
          generate_release_notes: true

  verify-release:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Waiting for PyPI to sync...
        run: sleep 60

      - name: Trying to install from PyPI
        run: |
          python -m venv prodenv
          source prodenv/bin/activate
          pip install whis
          whis --version
          whis --help
          WHIS_LLM_PROVIDER=dummy WHIS_LLM_MODEL=dummy whis smoke
