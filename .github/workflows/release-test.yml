
name: Test Release to TestPyPI

on:
  push:
    tags:
      - 'v*-test'  # e.g., v0.1.0a3-test
  workflow_dispatch:  # manual trigger

jobs:
  test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Test installation from TestPyPI
        run: |
          # wait a moment
          sleep 30

          python -m venv test_env
          source test_env/bin/activate

          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ whis-cli

          whis --version
          whis --help
          WHIS_LLM_PROVIDER=dummy WHIS_LLM_MODEL=dummy whis smoke
