[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whis"
version = "0.1.0a5"  # next alpha
description = "A tiny Linux command whisperer that suggests shell commands based on natural language."
readme = "README.md"
license = { file = "LICENSE", content-type = "text/markdown" }
requires-python = ">=3.10"

authors = [
    { name = "Milan Slesarik", email = "milslesarik@gmail.com" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Utilities",
]

dependencies = [
    "openai",
    "ollama",
    "pyperclip", # clipboard management
    "tomli >= 1.2.0; python_version < '3.11'",  # Python 3.11+ has tomllib built-in
    "prompt_toolkit>=3.0.51"
]

[project.scripts]
whis = "whis.__main__:main"

[project.urls]
Homepage = "https://github.com/milano-slesarik/whis"
"Bug Tracker" = "https://github.com/milano-slesarik/whis/issues"

[tool.setuptools]
packages = { find = { include = ["whis*"] } }

[tool.setuptools.package-data]
whis = ["config.template.toml", "system_prompt.txt"]

[project.optional-dependencies]
dev = [
    "dotenv",
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit>=4.3.0,<5"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort (import sorting)
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["whis"]

[tool.pytest.ini_options]
addopts = "-q --cov=whis --cov-report=term-missing --cov-report=xml  --cov-fail-under=71"

[tool.coverage.run]
branch = true
source = ["whis"]
omit = [
    "whis/__main__.py",
    "whis/smoke.py",
    "whis/__init__.py"
]

[tool.coverage.report]
skip_empty = true
show_missing = true
