name: unit-tests
on:
#  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov

      - name: Test
        env:
          WHIS_ENV: test
          WHIS_LLM_PROVIDER: dummy
          WHIS_LLM_MODEL: dummy
        run: pytest -q --cov=whis --cov-report=xml --cov-report=term-missing

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true
